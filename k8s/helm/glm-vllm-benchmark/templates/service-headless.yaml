apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nameOverride }}-headless
  labels:
    app: {{ .Values.nameOverride }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: {{ .Values.nameOverride }}
  ports:
    - name: dist
      port: {{ .Values.topology.masterPort }}
      targetPort: {{ .Values.topology.masterPort }}
    - name: http
      port: 8000
      targetPort: 8000
