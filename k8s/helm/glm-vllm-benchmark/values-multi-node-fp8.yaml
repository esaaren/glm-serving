model:
  repoId: "zai-org/GLM-5.3-Flash"
  servedName: "zai-org/GLM-5.3-Flash"
  maxModelLen: 131072
  maxNumSeqs: 256
  maxNumBatchedTokens: 8192
  gpuMemoryUtilization: 0.90

topology:
  nnodes: 2
  gpusPerNode: 8
  tensorParallelSize: 16
  pipelineParallelSize: 1

tcpxo:
  enabled: true
  runNcclPrecheck: true

benchmarks:
  reasoningEffort: "low"
  outputTokens: 1024
  runs:
    - name: "gke_multi_node_16xH100_tp16_fp8_tcpxo_c64_4k"
      numPrompts: 64
      concurrency: 64
      inputTokens: 4096
      warmup: true
    - name: "gke_multi_node_16xH100_tp16_fp8_tcpxo_c256_4k"
      numPrompts: 256
      concurrency: 256
      inputTokens: 4096
      warmup: false
    - name: "gke_multi_node_16xH100_tp16_fp8_tcpxo_c8_120k"
      numPrompts: 8
      concurrency: 8
      inputTokens: 120000
      warmup: false
